<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="190" viewBox="0 0 1100 190" role="img" aria-labelledby="t d">
<title id="t">Karimi's engineering workbench</title>
<desc id="d">A restrained terminal-style panel showing project development principles and current focus.</desc>
<defs>
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#27343e" stroke-width=".6"/></pattern>
  <style>
    .m{font-family:'Courier New',monospace;letter-spacing:1px}
    .dim{fill:#84929e}.gold{fill:#d5a653}.white{fill:#e9edf0}
    .cursor{animation:blink 1.1s steps(2) infinite}
    @keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.cursor{animation:none}}
  </style>
</defs>
<rect width="1100" height="190" rx="4" fill="#0b0f13"/>
<rect width="1100" height="190" fill="url(#g)"/>
<rect x="1" y="1" width="1098" height="188" rx="4" fill="none" stroke="#52616d"/>
<path d="M1 35h1098" stroke="#394650"/>
<circle cx="22" cy="18" r="4" fill="#d5a653"/>
<circle cx="39" cy="18" r="4" fill="#667582"/>
<circle cx="56" cy="18" r="4" fill="#667582"/>
<text x="78" y="22" class="m dim" font-size="10">KW / WORKBENCH / SESSION 001</text>
<text x="1075" y="22" class="m gold" text-anchor="end" font-size="10">LOCAL NOTES</text>
<text x="35" y="68" class="m gold" font-size="12">&gt; objective</text>
<text x="180" y="68" class="m white" font-size="12">Turn real operational problems into dependable software.</text>
<text x="35" y="98" class="m gold" font-size="12">&gt; method</text>
<text x="180" y="98" class="m white" font-size="12">Understand → Model → Build → Test → Improve</text>
<text x="35" y="128" class="m gold" font-size="12">&gt; focus</text>
<text x="180" y="128" class="m white" font-size="12">Backend systems / automation / infrastructure / product engineering</text>
<text x="35" y="158" class="m gold" font-size="12">&gt; status</text>
<text x="180" y="158" class="m white" font-size="12">Continuously learning. Building in public.</text>
<rect x="535" y="147" width="8" height="14" fill="#d5a653" class="cursor"/>
<text x="1070" y="174" class="m dim" font-size="9" text-anchor="end">END OF TRANSMISSION / KW</text>
</svg>
